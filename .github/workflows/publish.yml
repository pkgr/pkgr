name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/*
      - fix/*
      - auto/recover-ubuntu20-image

concurrency:
  group: publish-images
  cancel-in-progress: false
  queue: max

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      promotion_matrix: ${{ steps.targets.outputs.promotion_matrix }}
    steps:
      - name: Define image targets
        id: targets
        run: |
          echo 'matrix=["ubuntu:20.04"]' >> "$GITHUB_OUTPUT"
          echo 'promotion_matrix=["debian:11","debian:12","debian:13","ubuntu:20.04","ubuntu:22.04","ubuntu:24.04","ubuntu:26.04","el:8","el:9","el:10","sles:12","sles:15","sles:16"]' >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: targets
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 0f92a13c72c1753546c05569003c59a2da86096b
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up target
        run: |
          IFS=':' read -r TARGET_DIST TARGET_VERSION <<< "${{ matrix.target }}"
          echo "TARGET_DIST=$TARGET_DIST" >> "$GITHUB_ENV"
          echo "TARGET_VERSION=$TARGET_VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.TARGET_DIST }}
          tags: |
            type=raw,value=${{ env.TARGET_VERSION }}-${{ env.SOURCE_SHA }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile.template
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PKGR_VERSION=0f92a13
            TARGET=${{ matrix.target }}

  promote-master:
    if: github.ref == 'refs/heads/auto/recover-ubuntu20-image'
    needs: [targets, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote master image aliases
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
          SOURCE_SHA: 0f92a13c72c1753546c05569003c59a2da86096b
          TARGETS: ${{ needs.targets.outputs.promotion_matrix }}
        run: |
          current=$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/master | cut -f1)
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "Skipping stale recovery for $SOURCE_SHA; current master is $current"
            exit 0
          fi

          mapfile -t targets < <(jq -r '.[]' <<< "$TARGETS")
          for target in "${targets[@]}"; do
            IFS=':' read -r dist version <<< "$target"
            image="$REPOSITORY/$dist"
            docker buildx imagetools inspect "$image:$version-$SOURCE_SHA" > /dev/null
          done

          current=$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/master | cut -f1)
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "Skipping stale recovery for $SOURCE_SHA; current master is $current"
            exit 0
          fi

          for target in "${targets[@]}"; do
            IFS=':' read -r dist version <<< "$target"
            image="$REPOSITORY/$dist"
            docker buildx imagetools create \
              --tag "$image:$version-master" \
              "$image:$version-$SOURCE_SHA"
          done
